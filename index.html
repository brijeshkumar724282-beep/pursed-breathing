<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Pursed Breathing</title>
<style>
:root{--bg:#0f172a;--fg:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8;--card:#1e293b;--line:#334155}
[data-theme="light"]{--bg:#f8fafc;--fg:#0f172a;--muted:#475569;--accent:#0284c7;--card:#fff;--line:#cbd5e1}
[data-theme="contrast"]{--bg:#000;--fg:#fff;--muted:#e5e5e5;--accent:#facc15;--card:#111;--line:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::selection{background:var(--accent);color:#000}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px}
body.large{font-size:118%}
h1{font-size:1.1rem;margin:6px 0 2px;font-weight:700}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 14px;text-align:center}
.stage{width:min(78vw,300px);height:min(78vw,300px);display:grid;place-items:center;position:relative;margin:8px 0}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line)}
.circle{width:40%;height:40%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#7dd3fc,#0284c7);display:grid;place-items:center}
.circle.anim{transition:width 2s ease-out,height 2s ease-out}
.circle.anim.ex{transition-duration:4s}
.circle.inhale{width:92%;height:92%}
.circle.exhale{width:40%;height:40%}
@media (prefers-reduced-motion:reduce){.circle.anim{transition:none}}
.phase{font-size:1.4rem;font-weight:800;text-align:center;min-height:2.2em;margin:14px 0 4px}
body.large .phase{font-size:1.8rem}
.hint{color:var(--muted);font-size:.9rem;min-height:1.5em;text-align:center;margin-bottom:10px}
.barwrap{width:min(92vw,360px);height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar{height:100%;width:0%;background:var(--accent)}
.sessbar{width:min(92vw,360px);height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.sessbar>div{height:100%;width:0%;background:var(--muted)}
.stats{display:flex;gap:16px;margin:14px 0 4px;color:var(--muted);font-size:.9rem;flex-wrap:wrap;justify-content:center}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.panel{width:min(92vw,360px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.panel h2{font-size:.8rem;margin:0 0 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:56px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);font-weight:700;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--accent);color:#082f49;border-color:var(--accent)}
[data-theme="contrast"] .chip.on{color:#000}
select,input[type=range]{accent-color:var(--accent)}
select{width:100%;padding:10px;border-radius:10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font-size:.95rem}
.btnrow{display:flex;gap:12px;margin-top:12px;width:min(92vw,360px)}
button.action{flex:1;padding:16px;min-height:56px;border-radius:16px;border:0;font-size:1.05rem;font-weight:700;cursor:pointer}
#start{background:var(--accent);color:#082f49}
[data-theme="contrast"] #start{color:#000}
#start.stop{background:#f87171;color:#450a0a}
.toggles{display:flex;gap:16px;margin-top:12px;font-size:.9rem;color:var(--muted);flex-wrap:wrap;justify-content:center}
.toggles label{display:flex;gap:8px;align-items:center;min-height:44px}
input[type=checkbox]{width:22px;height:22px}
.hist{font-size:.85rem;color:var(--muted);margin:6px 0 0;padding:0;list-style:none}
.hist li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<h1>Pursed Breathing</h1>
<p class="sub">Automatic loop &bull; no counting needed<br>2s in through nose &bull; 4s out through pursed lips</p>
<div class="stage" aria-hidden="true"><div class="ring"></div><div class="circle anim" id="circle"></div></div>
<div class="phase" id="phase" role="status" aria-live="polite">Tap Start</div>
<div class="hint" id="hint">Follow circle, sound + buzz</div>
<div class="barwrap"><div class="bar" id="bar"></div></div>
<div class="sessbar"><div id="sessbar"></div></div>
<div class="stats"><span>Cycles <b id="cycles">0</b></span><span>Time <b id="time">0:00</b></span><span>Streak <b id="streak">0d</b></span><span>Total <b id="total">0m</b></span></div>
<div class="btnrow"><button class="action" id="start">Start</button></div>

<div class="panel"><h2>Session length</h2><div class="row" id="lengths">
<button class="chip" data-min="1">1m</button><button class="chip on" data-min="3">3m</button><button class="chip" data-min="5">5m</button><button class="chip" data-min="10">10m</button><button class="chip" data-min="0">∞</button>
</div></div>

<div class="panel"><h2>Sound</h2>
<select id="soundmode" aria-label="Sound mode">
<option value="soft" selected>Soft beeps</option>
<option value="chime">Chime</option>
<option value="voice">Voice guide</option>
<option value="off">Off</option>
</select>
<div class="toggles">
<label>Vol <input type="range" id="vol" min="0" max="100" value="70" style="width:110px"></label>
<label><input type="checkbox" id="buzz" checked> Buzz</label>
<label><input type="checkbox" id="tick"> Tick</label>
</div></div>

<div class="panel"><h2>Look</h2><div class="row">
<button class="chip on" data-th="dark">Dark</button><button class="chip" data-th="light">Light</button><button class="chip" data-th="contrast">Contrast</button>
</div><div class="toggles"><label><input type="checkbox" id="bigtext"> Large text</label></div></div>

<div class="panel"><h2>History (last 7)</h2><ul class="hist" id="hist"></ul><div class="toggles"><button class="chip" id="clear">Clear</button></div></div>

<script>
const INHALE=2000, EXHALE=4000;
let running=false, raf=0, phaseStart=0, phaseLen=0, phase='idle', cycles=0, startTime=0, timerInt=0, sessMin=3, tickInt=0;
const $=id=>document.getElementById(id);
const circle=$('circle'), phaseEl=$('phase'), hint=$('hint'), bar=$('bar'), sessbar=$('sessbar'),
btn=$('start'), cEl=$('cycles'), tEl=$('time'), streakEl=$('streak'), totalEl=$('total'), histEl=$('hist');
let actx=null;
const store={load(){try{return JSON.parse(localStorage.getItem('pb_v2'))||{}}catch(e){return{}}},save(d){localStorage.setItem('pb_v2',JSON.stringify(d))}};
let prefs=Object.assign({theme:'dark',big:false,mode:'soft',vol:70,buzz:true,tick:false,len:3},store.load());
function applyPrefs(){document.body.dataset.theme=prefs.theme==='dark'?'':prefs.theme;
 document.body.classList.toggle('large',!!prefs.big);
 $('soundmode').value=prefs.mode; $('vol').value=prefs.vol; $('buzz').checked=prefs.buzz; $('tick').checked=prefs.tick;
 document.querySelectorAll('#lengths .chip').forEach(c=>c.classList.toggle('on',+c.dataset.min===prefs.len));
 document.querySelectorAll('[data-th]').forEach(c=>c.classList.toggle('on',c.dataset.th===(prefs.theme||'dark')));
 sessMin=prefs.len; renderStats();}
function persist(){store.save(prefs)}
function renderStats(){const d=store.load(); streakEl.textContent=(d.streak||0)+'d'; totalEl.textContent=Math.round((d.minutes||0))+'m';
 const h=d.hist||[]; histEl.innerHTML=h.length?h.map(x=>`<li><span>${x.d}</span><span>${x.m}m · ${x.c} cycles</span></li>`).join(''):'<li><span>No sessions yet</span><span>—</span></li>';}
function tone(f,t,dur){const v=prefs.vol/100; if(prefs.mode==='off'||v<=0)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended')actx.resume();
 const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;
 g.gain.setValueAtTime(.001,actx.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.001,.25*v),actx.currentTime+.03);
 g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
 o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur+.02);}catch(e){}}
function cue(kind){ if(kind==='in'){ if(prefs.mode==='soft'){tone(660,'sine',.35)} else if(prefs.mode==='chime'){tone(880,'sine',.5);setTimeout(()=>tone(1320,'sine',.5),120)} else if(prefs.mode==='voice'){speak('Breathe in')} buzzP(60);}
 else { if(prefs.mode==='soft'){tone(440,'sine',.35)} else if(prefs.mode==='chime'){tone(660,'sine',.5);setTimeout(()=>tone(440,'sine',.6),140)} else if(prefs.mode==='voice'){speak('Breathe out')} buzzP([40,40,40]); }}
function speak(t){ if(prefs.mode!=='voice')return; try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.volume=prefs.vol/100;speechSynthesis.speak(u);}catch(e){}}
function buzzP(p){ if(!$('buzz').checked)return; if(navigator.vibrate)navigator.vibrate(p);}
function tick(now){ if(!running)return; const el=now-phaseStart, p=Math.min(el/phaseLen,1); bar.style.width=(p*100)+'%';
 const total=sessMin*60000, se=Date.now()-startTime; if(sessMin>0){sessbar.style.width=Math.min(se/total*100,100)+'%'; if(se>=total){finish(true);return;}}
 if(el>=phaseLen)nextPhase(); else raf=requestAnimationFrame(tick);}
function setPhase(n){phase=n;phaseStart=performance.now();
 if(n==='inhale'){phaseLen=INHALE;circle.className='circle anim inhale';phaseEl.textContent='Breathe in';hint.textContent='Nose in… follow circle';cue('in');}
 else{phaseLen=EXHALE;circle.className='circle anim exhale';phaseEl.textContent='Breathe out';hint.textContent='Pursed lips out… slow';cue('out');}
 cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
 if(prefs.tick){clearInterval(tickInt);tickInt=setInterval(()=>tone(990,'sine',.08),1000);} }
function nextPhase(){if(phase==='inhale')setPhase('exhale');else{cycles++;cEl.textContent=cycles;setPhase('inhale');}}
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function record(mins){const d=store.load();d.sessions=(d.sessions||0)+1;d.minutes=(d.minutes||0)+mins;
 const today=new Date().toDateString(); if(d.lastDay!==today){d.streak=(d.lastDay&&((Date.now()-new Date(d.lastDay))/864e5)<2)?(d.streak||0)+1:1;d.lastDay=today;}
 d.hist=[{d:new Date().toLocaleDateString(),m:Math.round(mins*10)/10,c:cycles}].concat(d.hist||[]).slice(0,7);store.save(Object.assign(d,prefs));renderStats();}
function finish(auto){const mins=(Date.now()-startTime)/60000; if(mins>=0.2)record(mins);
 running=false;cancelAnimationFrame(raf);clearInterval(timerInt);clearInterval(tickInt);
 btn.textContent='Start';btn.classList.remove('stop');circle.className='circle anim';
 bar.style.width='0%';sessbar.style.width=auto?'100%':'0%';
 phaseEl.textContent=auto?'Done — nice work':'Paused';hint.textContent=auto?`${cycles} cycles in ${fmt(mins*60)}`:'Tap Start to restart';}
btn.onclick=()=>{ if(!running){running=true;cycles=0;cEl.textContent='0';startTime=Date.now();
  btn.textContent='Stop';btn.classList.add('stop');setPhase('inhale');
  timerInt=setInterval(()=>tEl.textContent=fmt((Date.now()-startTime)/1000),500);}
 else finish(false);};
document.querySelectorAll('#lengths .chip').forEach(c=>c.onclick=()=>{prefs.len=+c.dataset.min;sessMin=prefs.len;persist();applyPrefs();});
document.querySelectorAll('[data-th]').forEach(c=>c.onclick=()=>{prefs.theme=c.dataset.th==='dark'?'dark':c.dataset.th;persist();applyPrefs();});
$('soundmode').onchange=e=>{prefs.mode=e.target.value;persist()};
$('vol').oninput=e=>{prefs.vol=+e.target.value;persist()};
$('buzz').onchange=e=>{prefs.buzz=e.target.checked;persist()};
$('tick').onchange=e=>{prefs.tick=e.target.checked;persist()};
$('bigtext').onchange=e=>{prefs.big=e.target.checked;persist();applyPrefs();};
$('clear').onclick=()=>{const p=store.load();['sessions','minutes','streak','lastDay','hist'].forEach(k=>delete p[k]);store.save(Object.assign(p,prefs));renderStats();};
applyPrefs();renderStats();
</script>
</body>
</html>
